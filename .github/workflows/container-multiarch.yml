name: Build Multi-Arch Container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:

  build-amd64:
    uses: ./.github/workflows/container.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  build-arm64:
    uses: ./.github/workflows/container-arm64.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  manifest:
    name: Create and Push Multi-Arch Manifest
    needs:
      - build-amd64
      - build-arm64

    runs-on: ubuntu-24.04

    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ inputs.version }}"

          # Create multi-arch manifest
          podman manifest create kanka-ce:${VERSION}

          podman manifest add \
            kanka-ce:${VERSION} \
            docker://ghcr.io/${OWNER}/kanka-ce:${VERSION}-amd64

          podman manifest add \
            kanka-ce:${VERSION} \
            docker://ghcr.io/${OWNER}/kanka-ce:${VERSION}-arm64

          # Push version manifest
          podman manifest push --all \
            kanka-ce:${VERSION} \
            docker://ghcr.io/${OWNER}/kanka-ce:${VERSION}

          # Push same manifest as latest
          podman manifest push --all \
            kanka-ce:${VERSION} \
            docker://ghcr.io/${OWNER}/kanka-ce:latest
